[build-system]
requires = [
    "scikit-build-core==1.1.1",
    "pybind11==3.1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "rix"
dynamic = ["version"]
description = "Add another dimension to Pygame"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RIX contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "mypy==1.18.2",
    "pytest==9.2.0",
]
pygame = [
    "pygame-ce==2.5.8",
]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '^(?P<value>[0-9]+\.[0-9]+\.[0-9]+)$'

[tool.scikit-build]
cmake.version = ">=3.26"
ninja.version = ">=1.11"
build-dir = "build/scikit-build-msvc/{wheel_tag}"
build.targets = ["_rix"]
wheel.packages = ["python/rix", "python/easy3d"]
wheel.license-files = ["LICENSE", "LICENSES/THIRD_PARTY.md"]
editable.mode = "redirect"
sdist.include = [
    "VERSION",
    "CMakeLists.txt",
    "cmake/**",
    "engine/**",
    "bindings/**",
    "python/**",
    "tests/cpp/**",
    "LICENSES/**",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
warn_unreachable = true
files = [
    "python/rix/diagnostics.py",
    "python/rix/net",
    "python/rix/game_states.py",
    "python/rix/utilities.py",
    "tests/typecheck/public_api.py",
]

